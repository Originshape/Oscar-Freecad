# SPDX-License-Identifier: Apache-2.0
# Test Oscar as an addon inside the OFFICIAL FreeCAD builds (no custom app is built): the addon is linked
# into a throw-away FREECAD_USER_HOME/Mod, exactly where a user's Addon Manager would put it.
name: ci
on:
  push: { branches: [main] }
  pull_request:
env:
  FREECAD_TAG: "1.1.3"
jobs:
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }   # FreeCAD 1.1.x bundles Python 3.11
      # FreeCAD bundles requests/urllib3; a plain setup-python interpreter does not, and oscar.providers imports it
      - run: python -m pip install requests urllib3
      - run: python tests/run.py --pure
        env: { OSCAR_TEST_ALLOW_REAL_HOME: "1" }

  linux:
    runs-on: ubuntu-24.04
    needs: pure
    env:
      APPIMAGE: FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify FreeCAD
        run: |
          base="https://github.com/FreeCAD/FreeCAD/releases/download/$FREECAD_TAG"
          curl -fL --retry 3 -o "$APPIMAGE" "$base/$APPIMAGE"
          curl -fL --retry 3 -o sha.txt "$base/$APPIMAGE-SHA256.txt"
          echo "$(cut -d' ' -f1 sha.txt)  $APPIMAGE" | sha256sum -c -
          chmod +x "$APPIMAGE" && ./"$APPIMAGE" --appimage-extract > /dev/null
      - name: X11 libraries for the GUI smoke test
        run: sudo apt-get update && sudo apt-get install -y xvfb libxcb-cursor0 libgl1 libegl1
      - name: Console tests (full)
        run: |
          FC="$PWD/squashfs-root"
          export PYTHONHOME="$FC/usr" PATH_TO_FREECAD_LIBDIR="$FC/usr/lib" SSL_CERT_FILE="$FC/usr/ssl/cacert.pem"
          export QT_QPA_PLATFORM=offscreen OSCAR_TEST_LOCALE=C.UTF-8
          FREECADCMD="$FC/usr/bin/freecadcmd" scripts/test.sh full
      - name: GUI smoke test
        run: |
          FC="$PWD/squashfs-root"
          export PYTHONHOME="$FC/usr" PATH_TO_FREECAD_LIBDIR="$FC/usr/lib" SSL_CERT_FILE="$FC/usr/ssl/cacert.pem"
          export QT_QPA_PLATFORM=xcb OSCAR_TEST_LOCALE=C.UTF-8
          xvfb-run -a -s "-screen 0 1600x1000x24" env FREECAD_GUI="$FC/usr/bin/freecad" scripts/test.sh gui

  macos:
    runs-on: macos-latest
    needs: pure
    env:
      DMG: FreeCAD_1.1.3-macOS-arm64-py311.dmg
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, verify and install FreeCAD
        run: |
          base="https://github.com/FreeCAD/FreeCAD/releases/download/$FREECAD_TAG"
          curl -fL --retry 3 -o "$DMG" "$base/$DMG"
          curl -fL --retry 3 -o sha.txt "$base/$DMG-SHA256.txt"
          echo "$(cut -d' ' -f1 sha.txt)  $DMG" | shasum -a 256 -c -
          hdiutil attach -readonly -nobrowse -mountpoint /tmp/fc "$DMG"
          cp -R /tmp/fc/FreeCAD.app /Applications/FreeCAD.app && hdiutil detach /tmp/fc
      - run: scripts/test.sh full
      - run: scripts/test.sh gui

  windows:
    runs-on: windows-latest
    needs: pure
    env:
      ARCHIVE: FreeCAD_1.1.3-Windows-x86_64-py311.7z
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, verify and unpack FreeCAD
        shell: pwsh
        run: |
          $base = "https://github.com/FreeCAD/FreeCAD/releases/download/$env:FREECAD_TAG"
          curl.exe -fL --retry 3 -o $env:ARCHIVE "$base/$env:ARCHIVE"
          curl.exe -fL --retry 3 -o sha.txt "$base/$env:ARCHIVE-SHA256.txt"
          $expected = ((Get-Content sha.txt -TotalCount 1) -split '\s+')[0]
          if ((Get-FileHash $env:ARCHIVE -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "checksum mismatch" }
          7z x -y "-o$env:RUNNER_TEMP\fc" $env:ARCHIVE | Out-Null
      - name: Console tests (full, one process per module as scripts/test.sh does)
        shell: pwsh
        run: |
          $fc = (Get-ChildItem "$env:RUNNER_TEMP\fc" -Directory | Select-Object -First 1).FullName
          $env:PYTHONUTF8 = "1"; $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:OSCAR_ALLOW_CODE = "1"   # scripts are off by default and asked about per call; the suite runs them unasked
          $run = "$PWD\tests\run.py" -replace '\\', '/'
          $failed = @()
          foreach ($m in (Get-ChildItem "tests\test_*.py" | ForEach-Object { $_.BaseName })) {
            $scr = "$env:RUNNER_TEMP\oscar-test\$m"
            New-Item -ItemType Directory -Force "$scr\fchome\Mod" | Out-Null
            cmd /c mklink /J "$scr\fchome\Mod\Oscar" "$PWD" | Out-Null
            $env:FREECAD_USER_HOME = "$scr\fchome"; $env:OSCAR_TEST_MODULES = $m
            $env:OSCAR_AI_SETTINGS = "$scr\settings.json"; $env:OSCAR_PROJECTS_DIR = "$scr\projects"
            $env:OSCAR_LOG_DIR = "$scr\logs"; $env:OSCAR_CACHE_DIR = "$scr\cache"; $env:OSCAR_DOWNLOAD_DIR = "$scr\downloads"
            & "$fc\bin\freecadcmd.exe" -c "import sys; sys.argv=['run.py']; __file__='$run'; exec(open(__file__, encoding='utf-8').read())"
            if ($LASTEXITCODE -ne 0) { $failed += $m }
          }
          if ($failed.Count -gt 0) { throw "failed modules: $($failed -join ', ')" }
